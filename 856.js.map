<span class="flex items-center gap-3">
  @if (showReset) {
    <button (click)="reset()" class="bg-red-100 text-red-800 px-2 py-1 mr-2 rounded">Zurücksetzen</button>
  }
  @if (!verified) {
    <cap-widget
      #capRef
      [attr.key]="widgetKey"
      [attr.data-cap-api-endpoint]="apiEndpoint"
      [attr.data-cap-i18n-initial-state]="i18nInitial"
      [attr.data-cap-i18n-verifying-label]="i18nVerifying"
      [attr.data-cap-i18n-solved-label]="i18nSolved"
      [attr.data-cap-i18n-error-label]="i18nError"
      (solve)="onSolve($event)"
      (error)="onError($event)"
    ></cap-widget>
  }
</span>
