<div class="my-2 p-2 border rounded-md max-w-3xl mx-auto text-sm">
  <div class="flex">
    <h3 class="font-light">Dein Boost-Level: {{ factor }} / {{ boostMax }}</h3>

    <div class="grow mx-2 mt-1 bg-gray-200 h-3 rounded relative overflow-hidden">
      <div class="bg-blue-600 h-full transition-all duration-500" [style.width.%]="(factor / boostMax) * 100"></div>
    </div>

    <div>
      <button (click)="toggle()"
              class="top-3 text-sm px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-800">
        @if (detailsVisible()) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        }
      </button>
    </div>
  </div>

  <div class="flex space-x-2 transition-all overflow-clip"
       [ngClass]="detailsVisible() ? 'duration-300 mt-2' : 'duration-300 mt-0 h-0 opacity-0'">
    <div class="flex items-center gap-2">
      @if (locationEnabled) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="text-green-500 size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <div>Standort <span class="text-sm text-gray-500">(+3)</span></div>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="text-red-500 size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636" />
        </svg>
<!--        <button (click)="requestGeolocationPermission()" class="block mb-1">Standort prüfen (Klick) (+3)</button>-->
      }
    </div>

    <div class="flex items-center gap-2">
      @if (isHuman) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="text-green-500 size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="text-red-500 size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636" />
        </svg>
      }
      <button (click)="humanVisible = !humanVisible" class="block">Mensch <span class="text-sm text-gray-500">(+3)</span></button>
    </div>
  </div>

    @if (humanVisible) {
      <div class="mt-2">
      <app-cap-widget
        apiEndpoint="https://cap.potm.ch/e30635a0e7/"
        apiVerifyUrl="{{ verifyUrl }}/api/auth/captcha/verify/"
        [showReset]="true"
      />
      </div>
    }
</div>
