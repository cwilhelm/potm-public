<div class="max-w-3xl mx-auto pb-48">
  @if (game) {
    <app-game-view [game]="game" />

    @if (isVotingOpen) {
      <div class="mb-2">
        @if (homePlayers.length > 0) {
          <h2 class="text-xl font-semibold mt-4 mb-2">Wähle best Player von {{ game.homeTeamName }}</h2>
          <app-player-vote [players]="homePlayers" [teamId]="game.homeTeamId" [gameId]="gameId" [selectedVotes]="selectedVotes"></app-player-vote>
        }
        @if (awayPlayers.length > 0) {
          <h2 class="text-xl font-semibold mt-4 mb-2">Wähle best Player von {{ game.awayTeamName }}</h2>
          <app-player-vote [players]="awayPlayers" [teamId]="game.awayTeamId" [gameId]="gameId" [selectedVotes]="selectedVotes"></app-player-vote>
        }
      </div>
    }

    @if (statsLoaded) {
      <div
        class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-900 border-t shadow-md z-50 rounded-t-2xl select-none"
        [style.height.px]="panelHeight"
      >
      <!-- Drag-Handle oben -->
      <div
        class="absolute -top-4 left-0 right-0 h-8 cursor-ns-resize touch-none flex items-center justify-center"
        (pointerdown)="onResizeStart($event)"
      >
        <div class="h-5 w-24 rounded-full bg-gray-300 dark:bg-gray-700"></div>
      </div>

      <div class="p-4 h-full overflow-auto">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-center text-xl font-semibold w-full">Top 3</h3>
          <button
            type="button"
            class="absolute right-3 top-3 text-sm px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-800"
            (click)="toggleCompact()"
          >
            @if (compact) {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
              </svg>
            }
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <app-top3-results
            [gameId]="gameId!" [teamId]="game.homeTeamId" [teamName]="game.homeTeamName" [players]="homePlayers">
          </app-top3-results>
          <app-top3-results
            [gameId]="gameId!" [teamId]="game.awayTeamId" [teamName]="game.awayTeamName" [players]="awayPlayers">
          </app-top3-results>
        </div>
      </div>
      </div>
    }
  }
</div>
