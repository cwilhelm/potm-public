<h3 class="text-base font-medium mt-2">{{ teamName }}</h3>
@if( votes.length > 0 && totalVotes) {
  <div class="inline-block min-w-full py-1 align-middle sm:px-6 lg:px-8">
    <table class="relative min-w-full divide-y divide-gray-300 dark:divide-white/15">
      <thead>
      <tr>
        <th scope="col" class="py-1.5 pl-2 w-3/4 text-left text-sm font-semibold text-gray-900 sm:pl-0 dark:text-white">Name</th>
        <th scope="col" class="px-2 py-1.5 text-left text-sm font-semibold text-gray-900 dark:text-white">Stimmen</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 dark:divide-white/10">
      @for (vote of votes; track vote.player) {
        <tr>
          <td class="py-1.5 pl-2 text-sm font-medium whitespace-normal break-words text-gray-900 sm:pl-0 dark:text-white">{{ vote.playerObj.playerNumber }} {{ vote.playerObj.playerName }}</td>
          <td class="px-2 py-1.5 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400"><app-vote-bar [votes]="vote.totalWeight" [totalVotes]="totalVotes"/></td>
        </tr>
      }
      </tbody>
    </table>
  </div>
} @else {
  <div class="text-base font-medium mt-2">Noch keine Stimmen ..</div>
}
