<div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
  @for (player of players; track player.playerId) {
    <div (click)="vote(player)"
         [ngClass]="selectedVotes.get(teamId!) === player.playerId
           ? 'bg-green-100 dark:bg-green-500'
           : 'hover:bg-gray-100 dark:hover:bg-gray-600'"
         class="cursor-pointer border p-2 rounded-md transition">
      @if (player.playerNumber) { <div class="font-bold">{{ player.playerNumber }} </div> }
      <div class="text-sm">{{ player.playerName }}</div>
    </div>
  }
</div>
